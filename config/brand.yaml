# Greenroom brand configuration for Beat ID Ltd.
#
# EVERYTHING IN THIS FILE IS TREATED AS FACT BY THE WRITER. It will be asserted, in
# writing, to real organisations, under Xavier's name.
#
# An earlier version of this file contained claims nobody had verified — "DJ nights",
# "artist liaison and rider management" — which I invented because they sounded like
# things an events company does. They went out in a draft and were caught only because
# a human read it. Config is upstream of every anti-hallucination guard in the codebase:
# a false claim here is laundered into a fact by the time the Writer sees it, and no
# test can catch it. If you cannot personally stand behind a line here, delete it.

company_name: "Beat ID Ltd"
sender_name: "Xavier John-Charles"
sender_email: "beatid.greenroom@gmail.com"
sender_role: "Founder"

# One paragraph. The spine of every pitch.
# XAVIER: this is deliberately thin — it contains only what I could source from you.
# Replace it with what Beat ID actually does, in your words.
pitch: >-
  Beat ID puts on live music nights built for student audiences. We handle the
  booking, the production and the promotion, so the union gets a full room without
  adding work to an already stretched events team.

# Concrete, checkable claims. The Writer is instructed to use these and invent nothing,
# so this list is the ceiling on what it can say about us.
# XAVIER: only the first two came from you. Add real ones, delete anything that is not.
proof_points:
  - "Run three times in East London, 80+ attendees per night"
  - "Drives measurable bar spend across the night, not just door numbers"

# XAVIER: fill these in if you have them — they materially improve reply rates, and the
# Writer can only link to what is here.
links:
  website: "https://beatidapp.com"
  past_events: ""
  mixes_or_video: ""
  press_or_reviews: ""

tone_notes: >-
  Warm, direct, and specific. Write like a person who has actually run these nights,
  not like a marketing department. Short paragraphs. No exclamation marks, no "I hope
  this email finds you well", no stacked adjectives. Lead with something true and
  specific about their venue or programme that proves the email was not a mail-merge.
  British English. Sign off simply. Aim for 120-180 words.

copy_rules:
  max_words: 200
  banned_phrases:
    - "I hope this email finds you well"
    - "circle back"
    - "synergy"
    - "reach out"
    - "game-changer"
    - "revolutionary"
  require_specific_hook: true
