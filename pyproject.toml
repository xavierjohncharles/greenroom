[project]
name = "greenroom"
version = "0.1.0"
description = "Autonomous booking-and-partnership agent for small event brands."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Xavier John-Charles", email = "crazyxydj@gmail.com" }]

dependencies = [
  # --- Agent framework (mandatory stack) ---
  "google-adk==2.8.0",
  "google-genai>=1.0.0",

  # --- Google Cloud ---
  "google-cloud-firestore>=2.19.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-pubsub>=2.23.0",
  "google-cloud-storage>=2.18.0",
  "google-cloud-trace>=1.13.0",

  # --- Workspace APIs (Gmail, Calendar) ---
  "google-api-python-client>=2.140.0",
  "google-auth>=2.34.0",
  "google-auth-oauthlib>=1.2.0",

  # --- Web / dashboard ---
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",

  # --- Config & validation ---
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pyyaml>=6.0.2",

  # --- Observability ---
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "python-json-logger>=2.0.7",

  # --- Posters ---
  "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
]
